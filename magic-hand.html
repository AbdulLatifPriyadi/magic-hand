<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Magic Hand - Pat the Cat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(160deg, #ffecd2 0%, #fcb69f 100%);
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      touch-action: manipulation;
    }

    /* ---- Cat Container ---- */
    #game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      padding: 20px;
    }

    .title {
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 800;
      color: #6b3a2a;
      margin-bottom: 10px;
      text-align: center;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: clamp(0.85rem, 3vw, 1.1rem);
      color: #8b5a3c;
      margin-bottom: 30px;
      text-align: center;
    }

    /* ---- Cat Face ---- */
    .cat-wrapper {
      position: relative;
      cursor: pointer;
      transition: transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .cat-wrapper:active {
      transform: scale(0.93);
    }

    .cat-wrapper.pop {
      animation: popAnim 0.25s ease-out;
    }

    @keyframes popAnim {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.18) rotate(-3deg); }
      70%  { transform: scale(0.95) rotate(2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      font-size: 1.5rem;
      pointer-events: none;
      animation: floatUp 0.9s ease-out forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(0.6); }
      50%  { opacity: 1; transform: translateY(-60px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-120px) scale(0.8); }
    }

    /* Cat SVG */
    .cat-svg {
      width: clamp(200px, 60vw, 300px);
      height: auto;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.15));
    }

    /* ---- Counter ---- */
    .counter {
      margin-top: 30px;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 700;
      color: #6b3a2a;
      background: rgba(255,255,255,0.5);
      padding: 10px 30px;
      border-radius: 50px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      text-align: center;
    }

    .counter-dots {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: clamp(220px, 65vw, 300px);
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(139, 90, 60, 0.25);
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .dot.filled {
      background: #e85d75;
      transform: scale(1.2);
      box-shadow: 0 0 8px rgba(232, 93, 117, 0.5);
    }

    /* ---- Reward Overlay ---- */
    #reward-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
    }

    #reward-overlay.show {
      display: block;
    }

    .reward-image {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* ---- Decorative paws ---- */
    .paw-bg {
      position: fixed;
      font-size: 2rem;
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

  <!-- Decorative paws -->
  <div class="paw-bg" style="top:10%;left:5%;transform:rotate(-20deg);">🐾</div>
  <div class="paw-bg" style="top:25%;right:8%;transform:rotate(15deg);">🐾</div>
  <div class="paw-bg" style="bottom:15%;left:10%;transform:rotate(10deg);">🐾</div>
  <div class="paw-bg" style="bottom:30%;right:5%;transform:rotate(-10deg);">🐾</div>

  <!-- Game Area -->
  <div id="game-area">
    <div class="title">Magic Hand</div>
    <div class="subtitle">Pat the cat 10 times!</div>

    <div class="cat-wrapper" id="cat" role="button" aria-label="Tap to pat the cat">
      <!-- Cute Cat SVG -->
      <svg class="cat-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Ears -->
        <polygon points="35,75 55,25 80,70" fill="#f5c06a"/>
        <polygon points="165,75 145,25 120,70" fill="#f5c06a"/>
        <polygon points="43,70 55,35 72,67" fill="#ffb6c1"/>
        <polygon points="157,70 145,35 128,67" fill="#ffb6c1"/>

        <!-- Head -->
        <ellipse cx="100" cy="115" rx="72" ry="65" fill="#f5c06a"/>

        <!-- Face markings -->
        <ellipse cx="100" cy="115" rx="60" ry="54" fill="#f8d080"/>

        <!-- Eyes -->
        <ellipse id="eyeL" cx="72" cy="105" rx="14" ry="16" fill="white"/>
        <ellipse id="eyeR" cx="128" cy="105" rx="14" ry="16" fill="white"/>
        <ellipse id="pupilL" cx="74" cy="107" rx="7" ry="9" fill="#3d2b1f"/>
        <ellipse id="pupilR" cx="130" cy="107" rx="7" ry="9" fill="#3d2b1f"/>
        <ellipse cx="77" cy="103" rx="3" ry="3.5" fill="white"/>
        <ellipse cx="133" cy="103" rx="3" ry="3.5" fill="white"/>

        <!-- Nose -->
        <ellipse cx="100" cy="128" rx="8" ry="6" fill="#ff8fa3"/>

        <!-- Mouth -->
        <path d="M 100 134 Q 92 142 86 140" stroke="#c4836a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M 100 134 Q 108 142 114 140" stroke="#c4836a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

        <!-- Whiskers left -->
        <line x1="20" y1="120" x2="60" y2="126" stroke="#c4836a" stroke-width="2" stroke-linecap="round"/>
        <line x1="18" y1="132" x2="60" y2="132" stroke="#c4836a" stroke-width="2" stroke-linecap="round"/>
        <line x1="22" y1="144" x2="60" y2="138" stroke="#c4836a" stroke-width="2" stroke-linecap="round"/>

        <!-- Whiskers right -->
        <line x1="180" y1="120" x2="140" y2="126" stroke="#c4836a" stroke-width="2" stroke-linecap="round"/>
        <line x1="182" y1="132" x2="140" y2="132" stroke="#c4836a" stroke-width="2" stroke-linecap="round"/>
        <line x1="178" y1="144" x2="140" y2="138" stroke="#c4836a" stroke-width="2" stroke-linecap="round"/>

        <!-- Blush -->
        <ellipse cx="55" cy="130" rx="14" ry="8" fill="#ffb6c1" opacity="0.5"/>
        <ellipse cx="145" cy="130" rx="14" ry="8" fill="#ffb6c1" opacity="0.5"/>

        <!-- Head highlight -->
        <ellipse cx="80" cy="85" rx="20" ry="12" fill="white" opacity="0.2"/>
      </svg>
    </div>

    <div class="counter">
      <span id="counter-text">0 / 10</span>
      <div class="counter-dots" id="dots"></div>
    </div>
  </div>

  <!-- Reward Overlay -->
  <div id="reward-overlay">
    <img class="reward-image" src="ring.jpg" alt="Magic ring">
  </div>

  <script>
    const TOTAL = 10;
    let count = 0;

    const cat        = document.getElementById('cat');
    const counterText = document.getElementById('counter-text');
    const dotsContainer = document.getElementById('dots');
    const rewardOverlay = document.getElementById('reward-overlay');

    // Build dots
    function buildDots() {
      dotsContainer.innerHTML = '';
      for (let i = 0; i < TOTAL; i++) {
        const d = document.createElement('div');
        d.className = 'dot';
        d.id = 'dot' + i;
        dotsContainer.appendChild(d);
      }
    }

    function updateUI() {
      counterText.textContent = count + ' / ' + TOTAL;
      for (let i = 0; i < TOTAL; i++) {
        const d = document.getElementById('dot' + i);
        if (i < count) d.classList.add('filled');
        else d.classList.remove('filled');
      }
    }

    function spawnHeart(x, y) {
      const hearts = ['❤️', '💖', '💕', '🐾'];
      const el = document.createElement('span');
      el.className = 'heart';
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      el.style.left = (x + (Math.random() - 0.5) * 60) + 'px';
      el.style.top  = (y - 20) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    function blinkEyes() {
      const eyeL = document.getElementById('eyeL');
      const eyeR = document.getElementById('eyeR');
      const pupilL = document.getElementById('pupilL');
      const pupilR = document.getElementById('pupilR');
      eyeL.setAttribute('ry', '2');
      eyeR.setAttribute('ry', '2');
      pupilL.style.display = 'none';
      pupilR.style.display = 'none';
      setTimeout(() => {
        eyeL.setAttribute('ry', '16');
        eyeR.setAttribute('ry', '16');
        pupilL.style.display = '';
        pupilR.style.display = '';
      }, 150);
    }

    function patCat(e) {
      if (count >= TOTAL) return;

      // Get position for heart
      const rect = cat.getBoundingClientRect();
      const x = e.clientX || (rect.left + rect.width / 2);
      const y = e.clientY || (rect.top + rect.height / 2);

      // Spawn heart particles
      spawnHeart(x, y);
      if (count % 2 === 1) spawnHeart(x + 20, y - 10);

      // Pop animation
      cat.classList.remove('pop');
      void cat.offsetWidth; // reflow
      cat.classList.add('pop');

      // Blink
      blinkEyes();

      count++;
      updateUI();

      if (count >= TOTAL) {
        setTimeout(showReward, 600);
      }
    }

    function showReward() {
      rewardOverlay.classList.add('show');
    }

    // Events
    cat.addEventListener('click', patCat);
    cat.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      patCat({ clientX: t.clientX, clientY: t.clientY });
    }, { passive: false });

    // Init
    buildDots();
    updateUI();

    // Idle blink every 3-5s
    setInterval(() => {
      if (count < TOTAL) blinkEyes();
    }, 3000 + Math.random() * 2000);
  </script>
</body>
</html>
